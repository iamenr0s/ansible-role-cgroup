---

repos:
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.4.0
    hooks:
      - id: ansible-lint
        # Override upstream's language_version: python3.14 pin — not every
        # dev machine has 3.14 yet; the default python3 works fine.
        language_version: python3
